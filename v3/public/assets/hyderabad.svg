<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520">
  <rect width="1600" height="520" fill="#faf6ee"/>
  <!-- distant hills -->
  <path d="M0 430 Q120 350 260 410 Q340 440 420 430 Z" fill="#d9e2cf" stroke="#a8b598" stroke-width="2"/>
  <path d="M-40 445 Q90 380 220 430 Q300 460 380 448 Z" fill="#c6d4b8" stroke="#a8b598" stroke-width="2"/>

  <!-- right hillside with fort -->
  <path d="M1180 440 Q1260 380 1360 420 Q1450 450 1600 430 L1600 520 L1180 520 Z" fill="#dfe6d2" stroke="#b3bf9f" stroke-width="2"/>

  <!-- water -->
  <rect y="440" width="1600" height="80" fill="#e8efe9"/>
  <path d="M0 460 Q200 452 400 460 T800 460 T1200 460 T1600 460" stroke="#c2d4c8" stroke-width="3" fill="none"/>

  <!-- boat -->
  <g>
    <path d="M150 480 Q220 505 300 480 L285 505 Q220 520 165 505 Z" fill="#8a4b2d"/>
    <rect x="165" y="462" width="120" height="20" rx="8" fill="#b2543a"/>
    <rect x="165" y="462" width="120" height="6" rx="3" fill="#d97357"/>
    <line x1="185" y1="462" x2="185" y2="480" stroke="#6e3620" stroke-width="3"/>
    <line x1="265" y1="462" x2="265" y2="480" stroke="#6e3620" stroke-width="3"/>
  </g>

  <!-- Charminar -->
  <g stroke="#b99b6b" stroke-width="3" fill="#f2e4c8">
    <!-- base structure -->
    <rect x="700" y="280" width="220" height="160"/>
    <!-- arches -->
    <path d="M725 440 v-70 a20 20 0 0 1 40 0 v70" fill="#e5d3ac"/>
    <path d="M795 440 v-70 a20 20 0 0 1 40 0 v70" fill="#e5d3ac"/>
    <!-- second tier -->
    <rect x="680" y="200" width="260" height="80"/>
    <path d="M700 280 v-50 a15 15 0 0 1 30 0 v50" fill="#e5d3ac"/>
    <path d="M750 280 v-50 a15 15 0 0 1 30 0 v50" fill="#e5d3ac"/>
    <path d="M850 280 v-50 a15 15 0 0 1 30 0 v50" fill="#e5d3ac"/>
    <path d="M800 280 v-50 a15 15 0 0 1 30 0 v50" fill="#e5d3ac"/>
    <!-- minarets -->
    <g>
      <rect x="668" y="120" width="26" height="320"/>
      <path d="M664 120 q17 -34 34 0 Z" fill="#e9d6ad"/>
      <circle cx="681" cy="82" r="4" fill="#b99b6b"/>
      <rect x="664" y="200" width="34" height="10" fill="#e0c99b"/>
    </g>
    <g>
      <rect x="926" y="120" width="26" height="320"/>
      <path d="M922 120 q17 -34 34 0 Z" fill="#e9d6ad"/>
      <circle cx="939" cy="82" r="4" fill="#b99b6b"/>
      <rect x="922" y="200" width="34" height="10" fill="#e0c99b"/>
    </g>
  </g>

  <!-- palace-like block left -->
  <g stroke="#c2a878" stroke-width="2.5" fill="#f5e8cf">
    <rect x="420" y="300" width="240" height="140"/>
    <path d="M420 300 q30 -30 60 0 q30 -30 60 0 q30 -30 60 0 q30 -30 60 0 Z" fill="#eeddb8"/>
    <rect x="440" y="330" width="24" height="40" rx="10" fill="#e5d3ac"/>
    <rect x="500" y="330" width="24" height="40" rx="10" fill="#e5d3ac"/>
    <rect x="560" y="330" width="24" height="40" rx="10" fill="#e5d3ac"/>
    <rect x="620" y="330" width="24" height="40" rx="10" fill="#e5d3ac"/>
  </g>

  <!-- trees -->
  <g fill="#7fa06b" stroke="#5f7f4f" stroke-width="2">
    <circle cx="380" cy="410" r="28"/>
    <circle cx="990" cy="405" r="32"/>
    <circle cx="1080" cy="415" r="24"/>
    <circle cx="1300" cy="420" r="30"/>
    <circle cx="1450" cy="425" r="22"/>
  </g>

  <!-- ground front -->
  <path d="M0 440 Q400 428 800 438 Q1200 448 1600 436 L1600 520 L0 520 Z" fill="none" stroke="#d8c8a6" stroke-width="2"/>
</svg>
